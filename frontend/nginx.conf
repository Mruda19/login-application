server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - React Router / client-side routing safe
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE: /api/* is NOT proxied here. The ALB routes /api/* directly to
    # the backend ECS target group, so the frontend only ever needs to be
    # reachable at "/". This avoids relying on container-to-container
    # networking between two separate ECS services.
}
